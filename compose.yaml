# Postgres for local development. The API and worker run from the host so the
# worker can reach Metal via MLX — a container on macOS cannot.
services:
  db:
    image: postgres:18-alpine
    container_name: scribe-db
    environment:
      POSTGRES_USER: scribe
      POSTGRES_PASSWORD: scribe
      POSTGRES_DB: scribe
    ports:
      - "5433:5432"   # 5433 to avoid colliding with a local Postgres
    volumes:
      # Postgres 18+ wants the mount one level up so it can keep
      # major-version subdirectories and support `pg_upgrade --link`.
      - scribe-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scribe -d scribe"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  scribe-db:
